name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # isolated-vm (pulled transitively by @n8n/node-cli) needs Node >= 22
          # to compile; npm ci on Node 20 fails in node-gyp.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Enforce complexity ceiling
        run: npm run quality:complexity

      - name: Test
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Inspect publish tarball
        run: npm pack --dry-run

  n8n-major-compatibility:
    name: n8n-workflow ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 1.x floor
            workflow_spec: "1.120.0"
          - label: 1.x current
            workflow_spec: "1"
          - label: 2.x floor
            workflow_spec: "2.0.0"
          - label: 2.x current
            workflow_spec: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install package toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install n8n compatibility target
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "n8n-workflow@${{ matrix.workflow_spec }}"
          npm ls n8n-workflow --depth=0

      - name: Build against n8n workflow types
        run: npm run build

      - name: Exercise node and credential contracts
        run: npm test
