name: Publish to npm

# n8n's verified-community-node program requires (from 2026-05-01) that packages
# are published from GitHub Actions with an npm provenance statement, signed via
# GitHub's OIDC infrastructure. n8n will NOT verify nodes published from a local
# machine. See https://docs.npmjs.com/generating-provenance-statements.
#
# Publishing is triggered by pushing a git tag like `v0.3.0`.
#
# One-time npm setup:
# OIDC Trusted Publishing (no long-lived secret):
#   npmjs.com -> the n8n-nodes-pisama package -> Settings -> Trusted Publishers
#   -> Add GitHub Actions: repo `Pisama-AI/n8n-nodes-pisama`, workflow `publish.yml`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      # --ignore-scripts skips the dev-only native build (isolated-vm, pulled
      # transitively by @n8n/node-cli) that n8n-node build/lint never load.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Enforce complexity ceiling
        run: npm run quality:complexity

      - name: Test with coverage gates
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Reject high and critical findings including development dependencies
        run: npm run audit:all-high

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Pack publish artifact
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release/*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: required for npm provenance and trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/

      - name: Select npm dist-tag
        id: dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish through npm trusted publishing
        run: npm publish ./dist/*.tgz --access public --tag "${{ steps.dist.outputs.tag }}"
